# ═══════════════════════════════════════════════════════════════════
# CI — Integración continua de CryptoWorld
#
# Dos jobs independientes:
#   backend  → pytest (unit + integración) contra PostgreSQL y Redis
#   frontend → typecheck (tsc) + build de producción (vite)
#
# Se ejecuta en cada push y pull request a las ramas principales.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, Javier-Dev]
  pull_request:
    branches: [main, Javier-Dev]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cryptoworld_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cryptoworld_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        working-directory: backend
        run: pytest --no-cov -q

  frontend:
    name: Frontend — typecheck y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build de producción
        working-directory: frontend
        run: npm run build
