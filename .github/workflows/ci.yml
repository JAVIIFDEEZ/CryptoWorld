# ═══════════════════════════════════════════════════════════════════
# CI — Integración continua de CryptoWorld
#
# Jobs:
#   lint      → ruff sobre el backend (estilo y errores estáticos)
#   backend   → pytest con cobertura mínima, contra PostgreSQL y Redis
#   deploy-check → `manage.py check --deploy` con la configuración REAL
#                  de producción; falla si reaparece un aviso de seguridad
#   frontend  → typecheck (tsc) + build de producción (vite)
#   audit     → vulnerabilidades conocidas en las dependencias
#
# Se ejecuta en cada push y pull request. El filtro de ramas incluye las
# ramas de trabajo `claude/**`, que antes quedaban fuera del pipeline y
# llegaban a la revisión sin haber pasado ni una sola comprobación.
# ═══════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, Javier-Dev, "claude/**"]
  pull_request:
    branches: [main, Javier-Dev]

# Una serie de pushes seguidos a la misma rama cancela las ejecuciones
# anteriores: solo interesa el resultado del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Backend — lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: pip install ruff==0.6.9

      - name: Comprobar estilo y errores estáticos
        working-directory: backend
        run: ruff check .

      # `ruff format --check` no se ejecuta todavía: reformatearía 57 de
      # los 114 ficheros del backend de una vez. Es una decisión de estilo
      # que merece su propio commit, no un efecto colateral de esta
      # auditoría — un diff así haría irrevisable cualquier otro cambio.
      # Para adoptarlo: `ruff format .` en un commit aislado y añadir
      # aquí el paso de verificación.

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cryptoworld_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # El resto del entorno de test lo fija pytest.ini (pytest-env), de
      # modo que la suite se comporta igual en local y en CI.
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cryptoworld_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Comprobar que no faltan migraciones
        # Un modelo cambiado sin su migración rompe el despliegue, no el
        # test: este paso lo detecta antes de fusionar.
        working-directory: backend/src
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-check-key-not-used-for-any-deployment-000000
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar tests con cobertura
        working-directory: backend
        # El umbral (--cov-fail-under) está en pytest.ini: la cobertura no
        # puede bajar sin que alguien lo decida explícitamente.
        run: pytest -q

  deploy-check:
    name: Backend — check --deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Validar la configuración de producción
        working-directory: backend/src
        env:
          # Configuración REAL de producción: DEBUG desactivado y una
          # SECRET_KEY de longitud válida. Cualquier aviso de seguridad
          # (cookies sin Secure, HSTS ausente, etc.) hace fallar el job.
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-deploy-check-key-with-enough-length-to-pass-validation
          DJANGO_ALLOWED_HOSTS: cryptoworld.example.org
          CORS_ALLOWED_ORIGINS: https://cryptoworld.example.org
          DB_HOST: localhost
          DB_NAME: cryptoworld_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check --deploy --fail-level WARNING

      - name: Generar el esquema OpenAPI
        working-directory: backend/src
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: ci-schema-key-not-used-for-any-deployment-0000
        run: python manage.py spectacular --fail-on-warn --file /tmp/schema.yml

      - name: Publicar el esquema como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: /tmp/schema.yml

  frontend:
    name: Frontend — typecheck y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de producción
        working-directory: frontend
        run: npm run build

  audit:
    name: Dependencias — vulnerabilidades conocidas
    runs-on: ubuntu-latest
    # Informativo: una CVE publicada aguas arriba no debe bloquear un
    # despliegue urgente, pero sí tiene que ser visible en cada ejecución.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditar dependencias Python
        working-directory: backend
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.txt --strict

      - name: Auditar dependencias npm
        working-directory: frontend
        run: npm audit --audit-level=high
