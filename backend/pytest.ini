# pytest.ini — Configuración de pytest para el backend
#
# pytest-django necesita saber qué módulo de settings usar.
# El PYTHONPATH apunta a src/ para que los imports funcionen.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = src
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
    --cov=core
    --cov=config
    --cov-report=term-missing
    --cov-fail-under=70

# Entorno determinista para la suite (plugin pytest-env).
#
# settings.py falla de forma deliberada si falta DJANGO_SECRET_KEY con
# DEBUG=False. Fijando aquí las variables, los tests no dependen del
# entorno de quien los ejecuta y comprueban siempre la misma
# configuración, en local y en CI. El prefijo `D:` significa "solo si no
# está ya definida", para que CI o Docker puedan sobrescribir el destino
# de la base de datos y de Redis.
env =
    DJANGO_DEBUG=True
    DJANGO_SECRET_KEY=pytest-insecure-key-not-used-in-any-deployment-0000000
    DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 testserver
    CELERY_TASK_ALWAYS_EAGER=True
    D:DB_HOST=localhost
    D:DB_USER=postgres
    D:DB_PASSWORD=postgres
    D:DB_NAME=cryptoworld_db
    D:REDIS_URL=redis://localhost:6379/0

markers =
    unit: Tests unitarios (sin base de datos ni servicios externos)
    integration: Tests de integración (requieren base de datos)
    security: Tests de controles de seguridad (auth, permisos, auditoría)
    e2e: Tests end-to-end
