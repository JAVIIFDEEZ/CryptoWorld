# nginx.conf — Configuración para servir la SPA React
#
# El bloque `location /` con `try_files` es esencial para SPAs:
# si la ruta no existe como archivo físico, sirve index.html
# para que React Router gestione la navegación del lado cliente.
#
# Sobre las cabeceras: en nginx, `add_header` NO se hereda dentro de un
# `location` que declare sus propias cabeceras. Las directivas a nivel de
# servidor se perdían en el bloque de assets (que sí añade Cache-Control),
# así que aquí se declaran en un fichero incluido desde cada bloque.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de las respuestas de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # No revelar la versión de nginx en las respuestas ni en las páginas
    # de error: es información gratuita para quien busca un exploit.
    server_tokens off;

    # Rutas de la SPA → siempre index.html
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Headers de caché para assets compilados con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
}
