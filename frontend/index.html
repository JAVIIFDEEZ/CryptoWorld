<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CryptoWorld — Sistema de análisis de criptomonedas" />
    <!-- PWA: instalable + tema de la barra del sistema -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CryptoWorld" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>CryptoWorld</title>
    <!-- Fuentes tipográficas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Aplica el tema antes de pintar para evitar el parpadeo (FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cw.theme') || 'dark';
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var light = t === 'light' || (t === 'system' && !dark);
          if (light) document.documentElement.classList.add('theme-light');
        } catch (e) { /* sin tema */ }
      })();
    </script>
    <!-- Punto de montaje de la SPA React -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
