# security-headers.conf — Cabeceras de seguridad de la SPA.
#
# Se incluye desde cada bloque `location` porque nginx no hereda
# `add_header` en un location que declare cabeceras propias: dejarlas
# solo a nivel de servidor hacía que el bloque de assets las perdiera.
#
# La Content-Security-Policy es la mitigación principal del riesgo
# aceptado de guardar el JWT en localStorage: sin ejecución de scripts
# externos ni inline, un XSS no tiene desde dónde leerlo.
#
#   default-src 'self'      Todo lo no declarado, solo del propio origen.
#   script-src  'self'      Sin 'unsafe-inline' ni 'unsafe-eval': Vite
#                           compila a ficheros con hash, no necesita ninguno.
#   style-src   + 'unsafe-inline'
#                           Tailwind y React inyectan estilos en línea; es
#                           la única concesión, y los estilos no ejecutan
#                           código.
#   img-src     + data: https:
#                           Los logos de los activos vienen de CoinGecko y
#                           los QR de 2FA llegan como data: URI.
#   connect-src + https:    Llamadas a la propia API tras el proxy TLS.
#   frame-ancestors 'none'  Anti-clickjacking (equivalente moderno y más
#                           estricto que X-Frame-Options).
#   object-src 'none'       Sin plugins Flash/Java heredados.
#   base-uri 'self'         Impide reescribir la base de las URLs relativas.
#   form-action 'self'      Los formularios no pueden enviarse a otro host.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
