# ═══════════════════════════════════════════════════════════════════
# nginx/nginx.prod.conf — Nginx de producción para CryptoWorld
#
# Arquitectura:
#   - Puerto 80:  redirige todo a HTTPS
#   - Puerto 443: sirve la SPA React + proxy inverso a Django API
#
# Flujo de peticiones:
#   Browser → https://tudominio.com/        → React SPA (index.html)
#   Browser → https://tudominio.com/api/*   → Django (backend:8000)
#   Browser → https://tudominio.com/admin/* → Django Admin (backend:8000)
#
# Requisitos previos en el servidor:
#   certbot certonly --webroot -w /var/www/certbot -d tudominio.com
# ═══════════════════════════════════════════════════════════════════

# ── Rate limiting (protección básica DDoS/brute force) ──────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── Redirigir HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name cryptoworld.duckdns.org;

    # Ruta para verificación de Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor HTTPS principal ────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name cryptoworld.duckdns.org;

    # ── Certificados SSL (Let's Encrypt via Certbot) ──────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Configuración TLS moderna (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Headers de seguridad ──────────────────────────────────────
    # HSTS solo tiene sentido en el bloque TLS, asi que vive aqui; el
    # resto se incluye por `location` porque nginx no hereda add_header
    # dentro de un location que declare cabeceras propias.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # No revelar la version de nginx.
    server_tokens off;

    # Compresion de respuestas de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ── Root y archivos estáticos React ──────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Assets compilados con hash → caché permanente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy inverso: /api/* → Django backend ────────────────────
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Permite respuestas largas (análisis ML, backtesting)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Buffer para evitar que Gunicorn espere al cliente lento
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ── Proxy inverso: /admin/ → Django Admin ─────────────────────
    location /admin/ {
        # El Django Admin solo accesible desde IPs de confianza (opcional)
        # allow 1.2.3.4;
        # deny all;

        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Rate limiting en endpoints de autenticación ───────────────
    location ~ ^/api/auth/(login|register|password-reset)/ {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA React: todas las rutas → index.html ───────────────────
    # Debe ir AL FINAL para no capturar /api/ ni /admin/
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
